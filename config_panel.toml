#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/config_panel.v1.schema.json
version = "1.0"

[catalogue]
name.fr = "Catalogue ARCenal"
help.fr = "La synchronisation quotidienne maintient le catalogue ARCenal à jour. Vous pouvez aussi demander une actualisation immédiate."

    [catalogue.canal]
    name.fr = "Canal de diffusion"

        [catalogue.canal.catalogue_channel]
        ask.fr = "Applications proposées"
        help.fr = "Stable propose les versions validées. Prévisualisation permet d’installer les candidates de recette avant leur promotion."
        type = "select"
        choices = ["stable", "preview"]
        default = "stable"
        bind = "null"

    [catalogue.etat]
    name.fr = "État de synchronisation"

        [catalogue.etat.catalogue_last_sync_at]
        ask.fr = "Dernière synchronisation"
        type = "string"
        readonly = true
        bind = "null"

        [catalogue.etat.catalogue_last_sync_result]
        ask.fr = "Résultat"
        type = "string"
        readonly = true
        bind = "null"

    [catalogue.actions]
    name.fr = "Actions"

        [catalogue.actions.actualiser_catalogue]
        ask.fr = "Actualiser le catalogue"
        help.fr = "Télécharge immédiatement les dernières applications ARCenal publiées."
        type = "button"
        style = "success"
        bind = "null"
